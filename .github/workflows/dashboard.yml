name: Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  trigger-typr:
    runs-on: ubuntu-latest
    steps:
      # Notify TypR, which embeds Rsem as a submodule: it rebuilds its image
      # with every submodule refreshed to its branch tip (an "unpinned" build)
      # and then triggers the r-typing dashboard itself.
      # Requires a PAT (PIPELINE_DISPATCH_TOKEN) with Contents read & write on
      # PRL-PRG/tyr, stored as a secret here in Rsem.
      - name: Trigger TypR rebuild
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PIPELINE_DISPATCH_TOKEN }}
          repository: PRL-PRG/tyr
          event-type: dependency-updated
          client-payload: >-
            {"repository": "${{ github.repository }}", "sha": "${{ github.sha }}"}
